@if (isBootstrapping()) {
  <div class="app-loading">
    <div class="app-loading-card">
      <h2>Study Planner</h2>
      <p>Загрузка приложения...</p>
    </div>
  </div>
} @else {
  <div class="layout" [class.layout-authenticated]="auth.isAuthenticated()">
    @if (auth.isAuthenticated()) {
      <aside class="sidebar">
        <h1>Study Planner</h1>

        <div class="user-block">
          <div class="user-block-head">
            <div class="user-copy">
              <strong>{{ auth.currentUser()?.profile?.full_name }}</strong>
              <span>{{ auth.currentUser()?.profile?.role }}</span>
            </div>

            <button
              type="button"
              class="logout-icon-button"
              (click)="logout()"
              aria-label="Logout"
              title="Logout"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                />
                <path
                  d="M14 8l4 4-4 4"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                />
                <path
                  d="M18 12H9"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                />
              </svg>
            </button>
          </div>
        </div>

        <nav class="navigation">
          <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
          <a routerLink="/tasks" routerLinkActive="active">Boards</a>
          <a routerLink="/subjects" routerLinkActive="active">Subjects</a>
          @if (auth.isSuperadmin()) {
            <a routerLink="/admin/subjects" routerLinkActive="active">Superadmin Panel</a>
          }
        </nav>
      </aside>
    }

    <main class="content" [class.content-guest]="!auth.isAuthenticated()">
      <router-outlet />
    </main>
  </div>
}
