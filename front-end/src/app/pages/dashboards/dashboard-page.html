<h2>Dashboard</h2>
<p>Welcome to your Study Planner dashboard.</p>

<div *ngIf="errorMessage()" class="error-message">{{ errorMessage() }}</div>

<div *ngIf="!isLoadingTasks() && !isLoadingSubjects()" class="dashboard-cards">
  <div class="card">
    <h3>Total Tasks</h3>
    <p>{{ totalTasks() }}</p>
  </div>

  <div class="card">
    <h3>Completed</h3>
    <p>{{ completedTasks() }}</p>
  </div>

  <div class="card">
    <h3>In Progress</h3>
    <p>{{ inProgressTasks() }}</p>
  </div>

  <div class="card">
    <h3>Overdue</h3>
    <p>{{ overdueTasks() }}</p>
  </div>

  <div class="card">
    <h3>Subjects</h3>
    <p>{{ totalSubjects() }}</p>
  </div>
</div>
