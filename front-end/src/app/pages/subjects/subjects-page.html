<h2>Subjects</h2>
<p>Subjects are loaded from the database.</p>

<div *ngIf="errorMessage()">{{ errorMessage() }}</div>

<div class="subject-form">
  <input [(ngModel)]="newSubject.name" name="name" placeholder="Subject name" />
  <textarea
    [(ngModel)]="newSubject.description"
    name="description"
    placeholder="Description"
  ></textarea>
  <input [(ngModel)]="newSubject.color" name="color" placeholder="Color" />
  <button type="button" (click)="createSubject()">Create Subject</button>
</div>

<div *ngIf="!isLoading() && !errorMessage()" class="subjects-list">
  @for (subject of subjects(); track subject.id) {
    <div class="subject-card">
      <h3>{{ subject.name }}</h3>
      <p>ID: {{ subject.id }}</p>
      <p>{{ subject.description || 'No description' }}</p>
    </div>
  }
</div>
