<section class="subjects-page">
  <header class="page-header">
    <h2>Предметы</h2>
    <p>Общий список предметов. Добавление доступно только superadmin.</p>
  </header>

  <div *ngIf="errorMessage()" class="error-message">
    {{ errorMessage() }}
  </div>

  <div *ngIf="isLoading()" class="empty-state">
    Загрузка предметов...
  </div>

  <div *ngIf="!isLoading() && !errorMessage()" class="subjects-list">
    @for (subject of subjects(); track subject.id) {
      <article class="subject-card">
        <div
          class="subject-color"
          [style.background]="subject.color || '#2563eb'"
        ></div>

        <div class="subject-content">
          <h3>{{ subject.name }}</h3>
          <p>{{ subject.description || 'Описание пока не добавлено.' }}</p>
        </div>
      </article>
    }
  </div>
</section>
