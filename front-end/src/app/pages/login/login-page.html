<div class="login-page">
  <div class="login-card">
    <h2>Вход</h2>
    <p>Войдите в Study Planner.</p>

    <div *ngIf="errorMessage()" class="error-message">
      {{ errorMessage() }}
    </div>

    <form (ngSubmit)="submit()" class="login-form">
      <label class="field-label">
        <span>Логин *</span>
        <input [(ngModel)]="form.login" name="login" type="text" placeholder="Email или username" />
      </label>

      <label class="field-label">
        <span>Пароль *</span>
        <input
          [(ngModel)]="form.password"
          name="password"
          type="password"
          placeholder="Введите пароль"
        />
      </label>

      <button type="submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Входим...' : 'Войти' }}
      </button>
    </form>

    <div class="divider">
      <span>или</span>
    </div>

    <div class="google-button-wrap">
      <div id="google-signin-button"></div>
    </div>

    <div class="auth-link">
      <p>
        Нет аккаунта?
        <a routerLink="/register">Зарегистрироваться</a>
      </p>
    </div>
  </div>
</div>
