<h2>Tasks</h2>

<div *ngIf="errorMessage()">{{ errorMessage() }}</div>

<div class="task-form">
  <input [(ngModel)]="newTask.title" name="title" placeholder="Title" />

  <textarea
    [(ngModel)]="newTask.description"
    name="description"
    placeholder="Description"
  ></textarea>

  <input [(ngModel)]="newTask.dueDate" name="dueDate" type="date" />

  <select [(ngModel)]="newTask.priority" name="priority">
    <option value="low">Low</option>
    <option value="medium">Medium</option>
    <option value="high">High</option>
  </select>

  <select [(ngModel)]="newTask.status" name="status">
    <option value="in_progress">In Progress</option>
    <option value="completed">Completed</option>
  </select>

  <input [(ngModel)]="newTask.subject" name="subject" type="number" placeholder="Subject ID" />

  <button type="button" (click)="createTask()">Create Task</button>
</div>

<div *ngIf="!isLoading() && !errorMessage()" class="task-list">
  @for (task of tasks(); track task.id) {
    <div class="task-card">
      <h3>{{ task.title }}</h3>
      <p>{{ task.description }}</p>
      <p>Due: {{ task.due_date }}</p>
      <p>Status: {{ task.status }}</p>
      <p>Priority: {{ task.priority }}</p>
      <p>Subject ID: {{ task.subject }}</p>

      <button type="button" (click)="updateTask(task, $event)">Mark Completed</button>
      <button type="button" (click)="deleteTask(task.id, $event)">Delete</button>
    </div>
  }
</div>
