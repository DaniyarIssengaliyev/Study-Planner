<div class="register-page">
  <div class="register-card">
    <h2>Registration</h2>
    <p>Create student's account.</p>

    <div *ngIf="errorMessage()" class="error-message">
      {{ errorMessage() }}
    </div>

    <div *ngIf="successMessage()" class="success-message">
      {{ successMessage() }}
    </div>

    <form (ngSubmit)="submit()" class="register-form">
      <label class="field-label">
        <span>Full name *</span>
        <input
          [(ngModel)]="form.full_name"
          name="full_name"
          type="text"
          placeholder="Surname Firstname"
        />
      </label>

      <label class="field-label">
        <span>Username *</span>
        <input [(ngModel)]="form.username" name="username" type="text" placeholder="username" />
      </label>

      <label class="field-label">
        <span>Email *</span>
        <input
          [(ngModel)]="form.email"
          name="email"
          type="email"
          placeholder="student@example.com"
        />
      </label>

      <label class="field-label">
        <span>Passsword *</span>
        <input
          [(ngModel)]="form.password"
          name="password"
          type="password"
          placeholder="At least 6 characters"
        />
      </label>

      <label class="field-label">
        <span>Faculty</span>
        <select [(ngModel)]="form.faculty_id" name="faculty_id" [disabled]="isFacultiesLoading()">
          <option [ngValue]="null">Not selected</option>
          @for (faculty of faculties(); track faculty.id) {
            <option [ngValue]="faculty.id">{{ faculty.name }}</option>
          }
        </select>
      </label>

      <button type="submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Creating...' : 'Register' }}
      </button>
    </form>

    <div class="auth-link">
      <p>
        Already have an account?
        <a routerLink="/login">Login</a>
      </p>
    </div>
  </div>
</div>
