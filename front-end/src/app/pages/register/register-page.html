<div class="register-page">
  <div class="register-card">
    <h2>Регистрация</h2>
    <p>Создайте аккаунт студента.</p>

    <div *ngIf="errorMessage()" class="error-message">
      {{ errorMessage() }}
    </div>

    <div *ngIf="successMessage()" class="success-message">
      {{ successMessage() }}
    </div>

    <form (ngSubmit)="submit()" class="register-form">
      <label class="field-label">
        <span>Полное имя *</span>
        <input [(ngModel)]="form.full_name" name="full_name" type="text" placeholder="Иван Иванов" />
      </label>

      <label class="field-label">
        <span>Username *</span>
        <input [(ngModel)]="form.username" name="username" type="text" placeholder="ivanov" />
      </label>

      <label class="field-label">
        <span>Email *</span>
        <input [(ngModel)]="form.email" name="email" type="email" placeholder="student@example.com" />
      </label>

      <label class="field-label">
        <span>Пароль *</span>
        <input [(ngModel)]="form.password" name="password" type="password" placeholder="Минимум 6 символов" />
      </label>

      <label class="field-label">
        <span>Факультет</span>
        <select [(ngModel)]="form.faculty_id" name="faculty_id" [disabled]="isFacultiesLoading()">
          <option [ngValue]="null">Не выбран</option>
          @for (faculty of faculties(); track faculty.id) {
            <option [ngValue]="faculty.id">{{ faculty.name }}</option>
          }
        </select>
      </label>

      <button type="submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Создаем...' : 'Зарегистрироваться' }}
      </button>
    </form>

    <p class="auth-link">
      Уже есть аккаунт?
      <a routerLink="/login">Войти</a>
    </p>
  </div>
</div>
